<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBLITZ — InBody Assessment Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #CC0000;
    --gold: #C9A84C;
    --black: #0A0A0A;
    --dark: #111111;
    --card: #161616;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #666;
    --danger: #ff3333;
    --success: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(204,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(204,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px);
    padding: 0 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 70px;
  }

  .logo-mark {
    height: 58px;
    width: auto;
    display: flex;
    align-items: center;
  }

  .logo-mark img {
    height: 58px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
  }

  .brand-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: white;
  }

  .brand-tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-left: auto;
  }

  /* Main layout */
  main {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 50px 24px 80px;
  }

  /* Page title */
  .page-title {
    text-align: center;
    margin-bottom: 50px;
  }

  .page-title h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    letter-spacing: 6px;
    line-height: 1;
    background: linear-gradient(135deg, #fff 0%, #C9A84C 60%, #CC0000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .page-title p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Form card */
  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 32px;
  }

  .form-card-header {
    background: linear-gradient(90deg, var(--red), #880000);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .form-card-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: white;
  }

  .step-badge {
    width: 26px;
    height: 26px;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: white;
  }

  .form-body {
    padding: 28px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .field input, .field select {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: white;
    padding: 12px 16px;
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  .field input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(204,0,0,0.12);
  }

  /* Button picker - replaces <select> for mobile reliability */
  .btn-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn-picker button {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: #888;
    padding: 10px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn-picker button.selected {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  .field input::placeholder {
    color: #333;
  }

  .field-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: -4px;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  /* Submit button */
  .btn-analyze {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--red), #990000);
    border: none;
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 5px;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    margin-top: 28px;
  }

  .btn-analyze:hover {
    background: linear-gradient(135deg, #e60000, var(--red));
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(204,0,0,0.35);
  }

  .btn-analyze:active {
    transform: translateY(0);
  }

  .btn-analyze:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }

  .loading.active { display: block; }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Results */
  #results {
    display: none;
    animation: fadeUp 0.6s ease both;
  }

  #results.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Classification banner */
  .classification-banner {
    background: linear-gradient(135deg, #1a0000 0%, var(--card) 60%);
    border: 1px solid var(--red);
    border-radius: 2px;
    padding: 32px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .classification-banner::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(204,0,0,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .classification-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .classification-type {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    letter-spacing: 4px;
    color: white;
    line-height: 1;
    margin-bottom: 6px;
  }

  .classification-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .risk-flags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .risk-flag {
    padding: 4px 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 1px;
  }

  .risk-flag.danger {
    background: rgba(255,51,51,0.15);
    border: 1px solid rgba(255,51,51,0.3);
    color: #ff6666;
  }

  .risk-flag.warning {
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
  }

  .risk-flag.ok {
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.2);
    color: #4ade80;
  }

  /* Score meter */
  .score-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    text-align: center;
  }

  .score-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .score-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .score-unit {
    font-size: 12px;
    color: var(--muted);
  }

  /* Results sections */
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 640px) {
    .results-grid { grid-template-columns: 1fr; }
    header { padding: 0 20px; }
    .form-body { padding: 20px; }
  }

  .result-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .result-section-header {
    padding: 12px 20px;
    background: #1a1a1a;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .result-section-icon {
    font-size: 14px;
  }

  .result-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .result-section-body {
    padding: 20px;
  }

  .result-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid #1e1e1e;
    gap: 12px;
  }

  .result-item:last-child { border-bottom: none; }

  .result-item-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .result-item-value {
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: white;
    text-align: right;
  }

  .result-item-value.highlight {
    color: var(--gold);
    font-weight: 600;
  }

  /* Workout plan */
  .workout-plan {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .workout-plan-header {
    padding: 14px 24px;
    background: linear-gradient(90deg, #1a1500, #1a1a1a);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .workout-plan-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--gold);
  }

  .workout-plan-body {
    padding: 24px;
  }

  .day-block {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .day-header {
    background: #1a1a1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .day-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--red);
  }

  .day-focus {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .exercise-table {
    width: 100%;
    border-collapse: collapse;
  }

  .exercise-table th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    padding: 8px 16px;
    text-align: left;
    background: #131313;
    border-bottom: 1px solid var(--border);
  }

  .exercise-table td {
    padding: 10px 16px;
    font-size: 13px;
    border-bottom: 1px solid #1a1a1a;
    color: var(--text);
  }

  .exercise-table tr:last-child td { border-bottom: none; }

  .exercise-table tr:hover td { background: rgba(255,255,255,0.02); }

  .sets-reps {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    color: var(--gold);
    font-weight: 600;
  }

  .rest-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--muted);
  }

  /* Progression bars */
  .progression-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .progression-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: white;
    margin-bottom: 20px;
  }

  .week-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }

  .week-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    width: 60px;
    flex-shrink: 0;
  }

  .week-bar-wrap {
    flex: 1;
    height: 8px;
    background: #1a1a1a;
    border-radius: 1px;
    overflow: hidden;
  }

  .week-bar {
    height: 100%;
    border-radius: 1px;
    transition: width 1s ease;
  }

  .week-note {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    width: 130px;
    flex-shrink: 0;
  }

  /* AI insight box */
  .ai-insight {
    background: linear-gradient(135deg, #0d0d0d 0%, #111 100%);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
  }

  .ai-insight::before {
    content: 'AI INSIGHT';
    position: absolute;
    top: -1px;
    right: 20px;
    background: var(--gold);
    color: var(--black);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 3px 10px;
    font-weight: 700;
  }

  .ai-insight-text {
    font-size: 14px;
    line-height: 1.8;
    color: #ccc;
  }

  .ai-insight-text strong {
    color: var(--gold);
  }

  /* Reset button */
  .btn-reset {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 12px;
  }

  .btn-reset:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* Error */
  .error-box {
    background: rgba(255,51,51,0.08);
    border: 1px solid rgba(255,51,51,0.3);
    border-radius: 2px;
    padding: 16px 20px;
    font-size: 14px;
    color: #ff8080;
    margin-bottom: 20px;
    display: none;
  }

  .error-box.active { display: block; }

  /* TDEE display */
  .macro-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .macro-card {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 14px;
    text-align: center;
  }

  .macro-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .macro-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: white;
    line-height: 1;
    margin-bottom: 2px;
  }

  .macro-unit {
    font-size: 11px;
    color: var(--muted);
  }

  .macro-card.protein .macro-amount { color: var(--red); }
  .macro-card.carbs .macro-amount { color: var(--gold); }
  .macro-card.fat .macro-amount { color: #60a5fa; }

  /* Action buttons row */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .btn-whatsapp {
    padding: 16px;
    background: linear-gradient(135deg, #25D366, #1da851);
    border: none;
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn-whatsapp:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .btn-pdf {
    padding: 16px;
    background: linear-gradient(135deg, #C9A84C, #a07828);
    border: none;
    color: #0a0a0a;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    font-weight: 700;
  }

  .btn-pdf:hover { filter: brightness(1.1); transform: translateY(-1px); }

  @media (max-width: 480px) {
    .action-row { grid-template-columns: 1fr; }
  }

  /* PDF print styles */
  @media print {
    body { background: white !important; color: #111 !important; }
    body::before { display: none; }
    header { background: #CC0000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .brand-name, .brand-tagline { color: white !important; }
    #formSection, #loadingSection, .action-row, .btn-reset { display: none !important; }
    #results { display: block !important; }
    .form-card, .result-section, .workout-plan, .progression-section,
    .classification-banner, .score-card, .macro-card, .day-block, .ai-insight {
      border: 1px solid #ddd !important;
      background: #f9f9f9 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .classification-banner { background: #1a0000 !important; color: white !important; }
    .classification-type, .workout-plan-title, .progression-title { color: #CC0000 !important; }
    .result-item-value.highlight, .sets-reps, .macro-amount.protein { color: #CC0000 !important; }
    .result-section-title, .field label, .classification-label { color: #a07828 !important; }
    .score-card, .macro-card { background: #f0f0f0 !important; }
    .exercise-table th { background: #eee !important; }
    .week-bar-wrap { background: #ddd !important; }
    .ai-insight { border: 1px solid #C9A84C !important; background: #fffdf0 !important; }
    .ai-insight-text { color: #333 !important; }
    .risk-flag { border: 1px solid #ccc !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
